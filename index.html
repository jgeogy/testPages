<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Color Paths</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #unity-canvas {
            background: #000;
        }

        /* ===================== INTERNET POPUP ===================== */
        #internet-warning {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            font-family: 'Segoe UI', sans-serif;
            animation: fadeIn 0.6s ease forwards;
        }

        #popup-box {
            background: #111;
            border: 2px solid #00ff44;
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
            color: #fff;
            max-width: 420px;
            width: 85%;
            box-shadow: 0 0 25px rgba(0,255,0,0.5);
            animation: popupIn 0.5s ease forwards;
        }

            #popup-box h2 {
                margin: 0;
                font-size: 22px;
                color: #31ff66;
            }

            #popup-box p {
                font-size: 16px;
                margin: 14px 0 26px;
                line-height: 1.4rem;
            }

        #continueBtn {
            padding: 12px 26px;
            font-size: 16px;
            border: none;
            border-radius: 9px;
            background: #31ff66;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
        }

            #continueBtn:hover:enabled {
                background: #55ff88;
                transform: scale(1.05);
            }

            #continueBtn:disabled {
                opacity: .45;
                cursor: not-allowed;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes popupIn {
            from {
                opacity: 0;
                transform: scale(.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- 🌐 POPUP BEFORE UNITY LOAD -->
    <div id="internet-warning">
        <div id="popup-box">
            <h2>Internet Connection Required</h2>
            <p>
                This game requires an active internet connection.<br>
                Ensure you are online before continuing.
            </p>
            <button id="continueBtn">Continue</button>
        </div>
    </div>

    <!-- UNITY GAME -->
    <div id="unity-container">
        <canvas id="unity-canvas" width="720" height="1280" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <script>
        const container = document.getElementById("unity-container");
        const canvas = document.getElementById("unity-canvas");
        const loadingBar = document.getElementById("unity-loading-bar");
        const progressBarFull = document.getElementById("unity-progress-bar-full");
        const popup = document.getElementById("internet-warning");
        const continueBtn = document.getElementById("continueBtn");

        let unityInstance = null;

        function unityShowBanner(msg, type) { }

        // RESPONSIVE PORTRAIT CANVAS
        function resizeCanvas() {
            const targetAspectRatio = 9 / 16;
            const vw = window.visualViewport?.width || window.innerWidth;
            const vh = window.visualViewport?.height || window.innerHeight;
            let w, h;

            if (vw / vh > targetAspectRatio) {
                h = vh; w = h * targetAspectRatio;
            } else {
                w = vw; h = w / targetAspectRatio;
            }

            canvas.style.width = w + "px";
            canvas.style.height = h + "px";
        }
        resizeCanvas();
        window.visualViewport?.addEventListener('resize', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        // ===================== INTERNET CHECK =====================
        function updatePopup() {
            if (navigator.onLine) {
                continueBtn.disabled = false;
            } else {
                continueBtn.disabled = true;
                popup.style.display = "flex";
            }
        }

        continueBtn.addEventListener("click", () => {
            if (!navigator.onLine) return;
            popup.style.display = "none";
            container.style.display = "flex";
            loadUnity();
        });

        window.addEventListener("online", updatePopup);
        window.addEventListener("offline", updatePopup);

        updatePopup();

        // ===================== UNITY LOADER =====================
        function loadUnity() {
            const buildUrl = "Build";
            const loaderUrl = buildUrl + "/Build.loader.js";
            const config = {
                dataUrl: buildUrl + "/Build.data",
                frameworkUrl: buildUrl + "/Build.framework.js",
                codeUrl: buildUrl + "/Build.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Zestful Games",
                productName: "Color Paths",
                productVersion: "1",
                showBanner: unityShowBanner
            };

            loadingBar.style.display = "block";
            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, progress => {
                    progressBarFull.style.width = (100 * progress) + "%";
                }).then(instance => {
                    unityInstance = instance;
                    loadingBar.style.display = "none";

                    // If connection drops mid-play → return popup
                    window.addEventListener("offline", () => {
                        popup.style.display = "flex";
                        continueBtn.disabled = true;
                    });

                }).catch(alert);
            };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>

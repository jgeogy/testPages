<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ZombieLand</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-canvas {
            display: block;
            touch-action: none;
        }

        /* 🔹 ADDED Popup styling */
        #connection-popup {
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 22px;
            text-align: center;
        }

        #popup-ok {
            margin-top: 20px;
            padding: 10px 22px;
            background: #0066ff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            color: white;
        }
    </style>
</head>

<body>
    <div id="connection-popup">
        <!-- 🔹 ADDED -->
        <div>⚠ Internet Connection Required</div>
        <button id="popup-ok">OK</button>
    </div>

    <div id="unity-container">
        <canvas id="unity-canvas" width="720" height="1280" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <script>

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");
        var unityInstance = null;

        // 16:9 Resize Logic
        function resizeCanvas() {
            let screenW = window.innerWidth;
            let screenH = window.innerHeight;

            let targetRatio = 9 / 16;        // Portrait Ratio
            let currentRatio = screenW / screenH;

            if (currentRatio > targetRatio) {
                // Screen too wide → match height
                canvas.style.height = screenH + "px";
                canvas.style.width = (screenH * targetRatio) + "px";
            } else {
                // Screen too tall → match width
                canvas.style.width = screenW + "px";
                canvas.style.height = (screenW / targetRatio) + "px";
            }
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Webgl.loader.js";
        var config = {
            dataUrl: buildUrl + "/Webgl.data",
            frameworkUrl: buildUrl + "/Webgl.framework.js",
            codeUrl: buildUrl + "/Webgl.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "ZestfulGames",
            productName: "ZombieLand",
            productVersion: "2",
        };

        config.matchWebGLToCanvasSize = false;

        document.getElementById("popup-ok").onclick = function () {
            document.getElementById("connection-popup").style.display = "none";
            startUnityGame();
        };

        function startUnityGame() {
            loadingBar.style.display = "block";
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = (100 * progress) + "%";
                }).then((instance) => {
                    unityInstance = instance;
                    loadingBar.style.display = "none";
                }).catch((message) => {
                    alert(message);
                });
            };
            document.body.appendChild(script);
        }

    </script>

</body>
</html>
